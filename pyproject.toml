[project]
name = "local-bookshelf"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml==0.7.1",
    "flask>=3.1,<4",
    "numpy>=2,<3",
    "onnxruntime>=1.24,<2",
    "tokenizers>=0.22,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ty>=0.0.100",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.16.2",
    "pytest-mock>=3.17.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pytest.ini_options]
strict = true
addopts = "--cov=local_bookshelf --cov-config=.coveragerc --cov-branch --cov-report=html"
pythonpath = ["src"]
testpaths = ["tests"]
